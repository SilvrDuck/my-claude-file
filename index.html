<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My CLAUDE.md</title>
  <meta name="description" content="Just my CLAUDE.md. Feel free to use it.">
  <meta property="og:title" content="My CLAUDE.md">
  <meta property="og:description" content="Just my CLAUDE.md. Feel free to use it.">
  <meta property="og:url" content="https://claudefile.com">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css"
    media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css"
    media="(prefers-color-scheme: dark)">

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --btn-bg: #f6f8fa;
      --btn-hover: #eaeef2;
      --code-bg: #f6f8fa;
      --link: #0969da;
      --accent: #1a7f37;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --btn-bg: #21262d;
        --btn-hover: #30363d;
        --code-bg: #0d1117;
        --link: #2f81f7;
        --accent: #3fb950;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header .title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      font-weight: 600;
    }

    header .title::before {
      content: "$";
      color: var(--accent);
      font-weight: 700;
    }

    header p {
      margin: 0 0 0.85rem;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.875rem;
    }

    nav a {
      color: var(--link);
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .code-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--code-bg);
      overflow: hidden;
    }

    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      z-index: 2;
      background: var(--btn-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: var(--btn-hover);
    }

    .copy-btn:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .copy-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .copy-btn .icon-check {
      display: none;
      color: var(--accent);
    }

    .copy-btn.copied .icon-copy {
      display: none;
    }

    .copy-btn.copied .icon-check {
      display: block;
    }

    pre {
      margin: 0;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      background: transparent;
    }

    pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      font-family: inherit;
      white-space: pre;
      tab-size: 2;
    }

    .status {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
    }

    .status a {
      color: var(--link);
    }

    @media (max-width: 600px) {
      .container {
        padding: 1.25rem 0.75rem 3rem;
      }

      pre {
        padding: 0.85rem;
      }

      pre code {
        font-size: 12px;
      }

      nav {
        gap: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1 class="title">claudefile.com</h1>
      <p>Just my CLAUDE.md. Feel free to use it.</p>
      <nav>
        <a href="https://github.com/SilvrDuck/my-claude-file" target="_blank" rel="noopener">source</a>
        <a href="https://github.com/SilvrDuck/my-claude-file/issues" target="_blank" rel="noopener">feedback</a>
        <a href="https://buymeacoffee.com/silvrduck" target="_blank" rel="noopener">☕ buy me a coffee</a>
      </nav>
    </header>

    <div class="code-wrap">
      <button class="copy-btn" id="copyBtn" aria-label="Copy CLAUDE.md to clipboard" title="Copy">
        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 11" />
        </svg>
      </button>
      <pre><code class="language-markdown" id="content"><span class="status">Loading…</span></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/markdown.min.js"></script>
  <script>
    (function () {
      const RAW_URL = 'https://raw.githubusercontent.com/SilvrDuck/my-claude-file/main/CLAUDE.md';
      const contentEl = document.getElementById('content');
      const copyBtn = document.getElementById('copyBtn');
      let rawText = '';

      copyBtn.disabled = true;

      fetch(RAW_URL, { cache: 'no-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (text) {
          rawText = text;
          contentEl.textContent = text;
          if (window.hljs) window.hljs.highlightElement(contentEl);
          copyBtn.disabled = false;
        })
        .catch(function () {
          contentEl.innerHTML = '<span class="status">Could not load CLAUDE.md. <a href="' + RAW_URL + '" target="_blank" rel="noopener">View raw on GitHub</a>.</span>';
        });

      copyBtn.addEventListener('click', async function () {
        if (!rawText) return;
        try {
          await navigator.clipboard.writeText(rawText);
          copyBtn.classList.add('copied');
          copyBtn.setAttribute('aria-label', 'Copied');
          setTimeout(function () {
            copyBtn.classList.remove('copied');
            copyBtn.setAttribute('aria-label', 'Copy CLAUDE.md to clipboard');
          }, 2000);
        } catch (e) {
          console.error('Clipboard write failed', e);
        }
      });
    })();
  </script>

</body>

</html>
